[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbviz-pipeline"
version = "0.1.0"
description = "Aggregate Deutsche Bahn monthly Parquet data for the visualization"
requires-python = ">=3.9"
dependencies = ["huggingface_hub>=0.25,<2", "polars>=1.20,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
dbviz-aggregate = "dbviz_pipeline.aggregate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]